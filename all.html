<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>

html, body {
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#011049;
color:#ffffff;
font-family:'Montserrat',sans-serif;
}

.page{
box-sizing:border-box;
width:100%;
height:100vh;
padding:clamp(24px,10vh,120px) clamp(32px,10vw,160px);
display:flex;
flex-direction:column;
background:linear-gradient(180deg,#02135c 0%,#011049 100%);
}

.topbar{
flex:0 0 auto;
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:20px;
margin-bottom:clamp(8px,1.2vh,22px);
width:100%;
}

.brandBlock{
display:flex;
flex-direction:column;
gap:4px;
min-width:0;
}

.title{
font-size:clamp(35px,3.4vh,55px);
font-weight:700;
line-height:1;
letter-spacing:0.03em;
text-transform:uppercase;
}

.timestamp{
flex:0 0 auto;
text-align:right;
font-size:clamp(12px,1.4vh,18px);
line-height:1.35;
color:#d5def0;
}

.totalBar{
flex:0 0 auto;
box-sizing:border-box;
margin-bottom:clamp(8px,1.2vh,22px);
border-radius:0px;
background:linear-gradient(90deg,#7a0000 0%,#960000 100%);
box-shadow:0 10px 30px rgba(0,0,0,0.25);
padding:clamp(8px,1.4vh,20px) clamp(16px,1.6vw,28px);
display:flex;
justify-content:space-between;
align-items:center;
gap:18px;
width:100%;
}

.totalLabel{
font-size:clamp(16px,2.6vh,36px);
font-weight:600;
letter-spacing:0.04em;
text-transform:uppercase;
line-height:1.05;
}

.totalValue{
font-size:clamp(20px,3vh,40px);
font-weight:600;
line-height:1;
white-space:nowrap;
font-variant-numeric:tabular-nums;
font-feature-settings:"tnum";
}

.board{
flex:1;
display:grid;
grid-template-columns:1fr 1fr 1fr;
grid-template-rows:minmax(0,1fr);
gap:clamp(6px,0.8vh,14px) clamp(14px,1.2vw,24px);
min-height:0;
width:100%;
}

.column{
display:flex;
flex-direction:column;
gap:clamp(6px,0.8vh,14px);
min-width:0;
min-height:0;
}

.countyRow{
flex:1 1 0;
container-type:size;
display:flex;
align-items:center;
min-width:0;
min-height:0;
}

.countyCard{
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
gap:18px;
border-radius:0px;
background:rgba(255,255,255,0.06);
border-left:8px solid #960000;
padding:clamp(8px,16cqh,20px) clamp(14px,1.3vw,24px);
box-shadow:inset 0 0 0 1px rgba(255,255,255,0.05);
min-width:0;
overflow:hidden;
}

.countyName{
font-size:clamp(11px,26cqh,34px);
font-weight:600;
line-height:1.08;
padding-right:10px;
min-width:0;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}

.countyValue{
flex:0 0 auto;
font-size:clamp(12px,30cqh,38px);
font-weight:600;
letter-spacing:-0.02em;
line-height:1;
white-space:nowrap;
font-variant-numeric:tabular-nums;
font-feature-settings:"tnum";
}

#content{
flex:1;
display:flex;
flex-direction:column;
min-height:0;
width:100%;
}

.loading,
.error{
align-items:center;
justify-content:center;
font-size:clamp(22px,2vw,34px);
font-weight:700;
text-align:center;
}

.error{
color:#ffb4b4;
}

@media (max-width:1100px){

.board{
grid-template-columns:1fr;
}

.topbar{
flex-direction:column;
align-items:flex-start;
}

.timestamp{
text-align:left;
}

.totalBar{
flex-direction:column;
align-items:flex-start;
}

.totalValue{
white-space:normal;
}

}

</style>
</head>

<body>

<div class="page">

<div class="topbar">
<div class="brandBlock">
<div class="title">WE Energies Outages - Wisconsin</div>
</div>
<div class="timestamp" id="timestamp">Loading...</div>
</div>

<div id="content" class="loading">
Loading outage totals...
</div>

</div>

<script>

const SOURCE_URL = "https://weoutages-json.schmidtya327.workers.dev/";

const TARGET_COUNTIES = [
"Adams",
"Brown",
"Calumet",
"Chippewa",
"Clark",
"Columbia",
"Crawford",
"Dane",
"Dodge",
"Dunn",
"Eau Claire",
"Florence",
"Fond du Lac",
"Forest",
"Grant",
"Green",
"Green Lake",
"Iowa",
"Jackson",
"Jefferson",
"Kenosha",
"Kewaunee",
"La Crosse",
"Lafayette",
"Langlade",
"Lincoln",
"Manitowoc",
"Marathon",
"Marinette",
"Marquette",
"Milwaukee",
"Monroe",
"Oconto",
"Oneida",
"Outagamie",
"Ozaukee",
"Pepin",
"Pierce",
"Polk",
"Portage",
"Racine",
"Richland",
"Rock",
"Rusk",
"Sauk",
"Shawano",
"Sheboygan",
"St. Croix",
"Vilas",
"Walworth",
"Washington",
"Waukesha",
"Waupaca",
"Winnebago",
"Wood"
];

function formatNumber(value){
return Number(value||0).toLocaleString('en-US');
}

function formatTimestamp(date){

const d = new Date(date);

return d.toLocaleString('en-US',{
month:'short',
day:'numeric',
hour:'numeric',
minute:'2-digit'
});

}

function render(data){

document.getElementById('timestamp').innerHTML =
'<strong>Data Updated</strong><br>'+formatTimestamp(data.updatedAt);

const COLUMN_COUNT = 3;
const perColumn = Math.max(1,Math.ceil(data.counties.length/COLUMN_COUNT));

const columns = [];
for(let i=0;i<COLUMN_COUNT;i++){
const slice = data.counties.slice(i*perColumn,(i+1)*perColumn);
while(slice.length < perColumn){
slice.push(null);
}
columns.push(slice);
}

function buildCards(counties){

return counties.map(county=> county ? `
<div class="countyRow">
<div class="countyCard">
<div class="countyName">${county.label}</div>
<div class="countyValue">${formatNumber(county.affected)}</div>
</div>
</div>
` : `
<div class="countyRow" style="visibility:hidden"></div>
`).join('');

}

const html = `

<div class="totalBar">
<div class="totalLabel">Total WE Energies Customers Out</div>
<div class="totalValue">${formatNumber(data.totalCustomersOut)}</div>
</div>

<div class="board">
${columns.map(col=>`<div class="column">${buildCards(col)}</div>`).join('')}
</div>
`;

const content = document.getElementById('content');
content.className='';
content.innerHTML=html;

}

async function loadData(){

try{

const response = await fetch(SOURCE_URL);
const raw = await response.json();

const countyTotals = {};
TARGET_COUNTIES.forEach(c => countyTotals[c.toLowerCase()]=0);

let totalCustomersOut = 0;

raw.forEach(outage=>{

const slices = outage.Slices || [];

slices.forEach(slice=>{

const county = (slice.County||"").toLowerCase().trim();
const affected = Number(slice.AffectedCusts||0);

totalCustomersOut += affected;

if(countyTotals.hasOwnProperty(county)){
countyTotals[county] += affected;
}

});

});

const counties = Object.keys(countyTotals)
  .map(c => ({
    label: c.replace(/\b\w/g, l => l.toUpperCase()) + " County",
    affected: countyTotals[c]
  }))
  .filter(c => c.affected > 0)
  .sort((a, b) => b.affected - a.affected);

render({
updatedAt:new Date(),
totalCustomersOut,
counties
});

}catch(e){

document.getElementById("content").innerText =
"Unable to load outage data";

}

}

loadData();

// Schedule a callback to fire at the next xx:x2 mark - Pads for the JSON to update on backend - (every 10 min, on the :02/:12/:22/:32/:42/:52)
function scheduleAtNext1(callback) {
  const now = new Date();
  const seconds = now.getSeconds();
  const minuteDigit = now.getMinutes() % 10;

  // Minutes until the next one ending in 2
  const minutesUntilNext1 = minuteDigit < 2 ? (2 - minuteDigit) : (12 - minuteDigit);

  // Subtract elapsed seconds in the current minute
  const msUntilNext = (minutesUntilNext1 * 60 - seconds) * 1000;

  setTimeout(() => {
    callback();
    setInterval(callback, 10 * 60 * 1000); // then every 10 min exactly
  }, msUntilNext);
}

scheduleAtNext1(loadData);

</script>

</body>
</html>
